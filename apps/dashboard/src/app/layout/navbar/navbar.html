<header
  class="flex items-center justify-between gap-1.5 border-b border-b-zinc-100 p-4"
>
  <nav class="flex items-center justify-between gap-1 flex-1">
    <app-breadcrumb />
    <div class="actions flex items-center gap-2">
      <app-lang-button />
      <app-theme-button />
    </div>
  </nav>
  <app-user-menu
    variant="navbar"
    class="md:hidden"
    [firstName]="user?.firstName"
    [lastName]="user?.lastName"
    [email]="user?.email"
    [userPhoto]="user?.profilePhoto"
  />
</header>
