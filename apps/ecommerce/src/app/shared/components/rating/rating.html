<div
  class="flex items-center gap-1 rounded-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400"
  [attr.role]="readonly() ? 'img' : 'slider'"
  [attr.aria-label]="readonly() ? label() : 'Rating'"
  [attr.tabindex]="readonly() ? null : 0"
  [attr.aria-valuemin]="readonly() ? null : 0"
  [attr.aria-valuemax]="readonly() ? null : max()"
  [attr.aria-valuenow]="readonly() ? null : currentValue()"
  [attr.aria-valuetext]="readonly() ? null : label()"
  (keydown)="onKeydown($event)"
  (mouseleave)="preview(null)"
>
  @for (fill of stars(); track $index; let i = $index) {
  <span class="relative inline-flex" aria-hidden="true">
    <!-- empty star -->
    <svg lucideStar class="size-4 text-zinc-200 fill-transparent"></svg>

    <!-- filled part -->
    <span
      class="absolute inset-y-0 start-0 flex overflow-hidden pointer-events-none"
      [style.width.%]="fill"
    >
      <svg
        lucideStar
        class="size-4 shrink-0 text-amber-400 stroke-[#FFA508] fill-[#FFA508]"
      ></svg>
    </span>

    <!-- click areas -->
    @if (!readonly()) {
    <span
      class="absolute inset-y-0 start-0 w-1/2 cursor-pointer"
      (mouseenter)="preview(i + 0.5)"
      (click)="select(i + 0.5)"
    ></span>
    <span
      class="absolute inset-y-0 end-0 w-1/2 cursor-pointer"
      (mouseenter)="preview(i + 1)"
      (click)="select(i + 1)"
    ></span>
    }
  </span>
  }
</div>
