<div class="lg:w-113 min-w-80 p-5">
  <h1 class="h1 mb-10">Login</h1>
  <form [formGroup]="loginForm" (ngSubmit)="submitHandler()">
    <div class="flex flex-col gap-4">
      <app-field
        controlName="username"
        label="Username"
        placeholder="user123"
        type="text"
        [errorMessages]="{
          required: 'Your username is required',
          minlength: 'Must be at least 3 characters',
        }"
      />
      <app-field
        controlName="password"
        label="Password"
        placeholder="********"
        type="password"
        [errorMessages]="{
          required: 'Your password is required',
          pattern:
            'Must contain at least 8 chars, 1 uppercase, 1 lowercase, 1 number, and 1 special',
        }"
      />
    </div>

    <!-- forget pass link -->
    <div class="flex justify-end mt-2.5 mb-10">
      <app-link link="/forget-password">Forgot your password?</app-link>
    </div>
    <!-- toast -->
    @if (displayToast()) {
    <app-toast (toastEvent)="displayToast.set($event)" [message]="errMsg()" />
    }

    <!-- submit button -->
    <app-button label="login" type="submit"></app-button>
    <div class="mt-9 text-center">
      <p class="font-geist font-medium text-sm">
        Don’t have an account?
        <app-link link="/register">Create yours</app-link>
      </p>
    </div>
  </form>
</div>
