<div class="lg:w-113 min-w-80 p-5">
  <div class="flex justify-center pb-4 border-b border-zinc-200">
    <app-auth-heading>Welcome back!</app-auth-heading>
  </div>
  <form [formGroup]="loginForm" (ngSubmit)="submitHandler()">
    <div class="flex flex-col gap-4 py-6">
      <app-input
        id="username"
        label="Username"
        type="text"
        placeholder="example"
        [control]="loginForm.controls.username"
      />

      <app-input
        id="password"
        label="Password"
        type="password"
        placeholder="********"
        [control]="loginForm.controls.password"
      />
    </div>

    <!-- forget pass link -->
    <div class="flex justify-end mt-2.5 mb-10">
      <app-link link="/forget-password">Forgot your password?</app-link>
    </div>

    <!-- submit button -->
    <button
      appButton
      type="submit"
      [loading]="isLoading()"
      size="full"
      variant="primary"
    >
      Login
    </button>
    <div class="mt-9 text-center">
      <p class="font-geist font-medium text-sm">
        Don’t have an account yet?
        <app-link link="/register">Create one now!</app-link>
      </p>
    </div>
  </form>
</div>
