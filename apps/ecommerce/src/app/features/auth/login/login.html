<div class="flex justify-center pb-4 border-b border-zinc-200">
  <app-auth-heading>{{ "auth.login.title" | translate }}</app-auth-heading>
</div>
<form [formGroup]="loginForm" (ngSubmit)="submitHandler()">
  <div class="flex flex-col gap-4 py-6">
    <app-input
      id="username"
      label="auth.login.username"
      type="text"
      placeholder="auth.login.username-placeholder"
      [control]="loginForm.controls.username"
    />

    <app-input
      id="password"
      label="auth.login.password"
      type="password"
      placeholder="********"
      [control]="loginForm.controls.password"
    />
  </div>

  <!-- forget pass link -->
  <div class="flex justify-end mt-2.5 mb-10">
    <app-link link="/forget-password"
      >{{ "auth.login.forgot-password" | translate }}</app-link
    >
  </div>

  <!-- submit button -->
  <button
    appButton
    type="submit"
    [loading]="isLoading()"
    size="full"
    variant="primary"
  >
    {{ "auth.login.login" | translate }}
  </button>
  <div class="mt-9 text-center">
    <p class="font-geist font-medium text-zinc-800 text-sm">
      {{ "auth.login.create-account" | translate }}
      <app-link link="/register"
        >{{ "auth.login.create-link" | translate }}</app-link
      >
    </p>
  </div>
</form>
