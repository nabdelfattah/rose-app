<div class="container mx-auto px-4">
  @if (product(); as current) {
    <app-product-details-info [product]="current" />
  }
</div>

<section class="related-products py-20">
    <div class="container mx-auto">
        <div class="flex flex-col gap-4">
            <app-section-title>{{"products.product-details.related-products"|translate}}</app-section-title>
            <app-related-products [products]="relatedProducts()" />
        </div>
    </div>
</section>
