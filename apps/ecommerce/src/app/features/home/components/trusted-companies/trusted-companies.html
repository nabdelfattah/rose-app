<section class="py-10 px-4">
  <div
    class="container mx-auto rounded-2xl bg-soft-pink-50 dark:bg-zinc-800 px-8 py-8"
  >
    <!-- Heading -->
    <p class="text-center font-semibold text-zinc-800 dark:text-zinc-100 mb-8 text-base sm:text-lg">
      Trusted By Over 4.5k+ Companies
    </p>

    <!-- Logos row — flex wraps on small screens -->
    <div
      class="flex flex-wrap justify-center items-center gap-x-10 gap-y-6 sm:gap-x-14"
    >
      @for (logo of logos; track logo.alt) {
        <img
          [src]="logo.src"
          [alt]="logo.alt"
          class="logo-img h-8 sm:h-9 w-auto object-contain"
          loading="lazy"
        />
      }
    </div>
  </div>
</section>
