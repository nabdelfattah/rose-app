<div class="section-container my-16 min-h-56">
  <header class="mb-4">
    <p class="text-xl md:text-2xl lg:text-5xl font-bold text-zinc-800">
      {{"orders.title" | translate}}
    </p>
  </header>

  <ul class="flex flex-col gap-4">
    @for (item of orders(); track item.id) {
    <app-order-item [item]="item" />
    }
  </ul>
</div>
