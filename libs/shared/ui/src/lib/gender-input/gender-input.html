<div class="flex flex-col gap-2">
  <label [for]="id()" class="text-zinc-800"> {{ label() | translate}} </label>

  <select
    [id]="id()"
    [formControl]="control()"
    class="border border-zinc-400 text-zinc-800 bg-white focus:border-maroon-600 dark:focus:border-pink-400 placeholder:text-zinc-400 p-4 rounded-[10px] outline-0"
    [class]="{
        'border-red-500': control().hasError('required') && control().touched,
        'border-zinc-400': !(control().hasError('required') && control().touched),
      }"
  >
    <option value="" disabled>{{ placeholder() | translate }}</option>
    <option value="male">{{'auth.register.about.male' | translate}}</option>
    <option value="female">{{'auth.register.about.female' | translate}}</option>
  </select>

  @if (control().hasError('required') && control().touched) {
  <p class="text-sm text-red-600">{{ 'validation.required' | translate: { field: (label() | translate) } }}</p>
  }
</div>
